services:
  - type: web
    name: sports-day-scoreboard
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ADMIN_PIN
        value: "1234"
      - key: GOLD_POINTS
        value: "10"
      - key: SILVER_POINTS
        value: "7"
      - key: BRONZE_POINTS
        value: "5"

